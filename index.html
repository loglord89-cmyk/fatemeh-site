<script>
  /* Runs before first paint: pick the language and set lang/dir on the root element. */
  (function () {
    var SUPPORTED = ["fa", "en", "ar", "ur", "tr", "ru", "hi", "es", "fr", "de", "pt", "it", "zh", "ja", "ko", "id"];
    var RTL = { fa: 1, ar: 1, ur: 1 };
    var lang = null;
    try { var s = localStorage.getItem('fm-lang'); if (s && SUPPORTED.indexOf(s) > -1) lang = s; } catch (e) {}
    if (!lang) {
      var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
      for (var i = 0; i < list.length && !lang; i++) {
        var p = String(list[i]).toLowerCase().split('-')[0];
        if (SUPPORTED.indexOf(p) > -1) lang = p;
      }
    }
    lang = lang || 'en';
    window.__fmLang = lang;
    var r = document.documentElement;
    r.setAttribute('lang', lang);
    r.setAttribute('dir', RTL[lang] ? 'rtl' : 'ltr');
    try { var th = localStorage.getItem('fm-theme'); if (th === 'dark' || th === 'light') r.setAttribute('data-theme', th); } catch (e) {}
  })();
</script>

<style>
  /* Layout: one editorial page that flips between LTR and RTL. The IELTS band-score ruler (5 to 9, always left-to-right) is the signature motif. */
  :root {
    --bg: #F2F5FA;
    --surface: #FFFFFF;
    --ink: #0D1B36;
    --muted: #4F5F7C;
    --line: #D3DCEA;
    --blue: #1D4ED8;
    --blue-ink: #FFFFFF;
    --gold: #F0B429;
    --gold-ink: #231A00;
    --tint: #E3EBFA;

    --f-display: "Bricolage Grotesque", system-ui, sans-serif;
    --f-body: Figtree, system-ui, sans-serif;
    --lh-body: 1.7;
    --lh-d: 1.1;
    --lh-h: 1.2;
    --ls-d: -0.02em;
    --eb-tt: uppercase;
    --eb-ls: 0.12em;
    --eb-fs: 0.72rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #09101F; --surface: #111B32; --ink: #E9EEF8; --muted: #9DABC6; --line: #243252;
      --blue: #7BA3FF; --blue-ink: #07122B; --gold: #F0B429; --gold-ink: #231A00; --tint: #13213F;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #09101F; --surface: #111B32; --ink: #E9EEF8; --muted: #9DABC6; --line: #243252;
    --blue: #7BA3FF; --blue-ink: #07122B; --gold: #F0B429; --gold-ink: #231A00; --tint: #13213F;
    color-scheme: dark;
  }

  /* Per-language type: face, line height, tracking. */
  :root:lang(fa) { --f-display: Vazirmatn, Tahoma, system-ui, sans-serif; --f-body: Vazirmatn, Tahoma, system-ui, sans-serif; --lh-body: 1.9; --lh-d: 1.45; --lh-h: 1.5; --ls-d: 0; --eb-tt: none; --eb-ls: 0; --eb-fs: 0.82rem; }
  :root:lang(ar), :root:lang(ur) { --f-display: "Noto Sans Arabic", Vazirmatn, Tahoma, system-ui, sans-serif; --f-body: "Noto Sans Arabic", Vazirmatn, Tahoma, system-ui, sans-serif; --lh-body: 1.9; --lh-d: 1.45; --lh-h: 1.5; --ls-d: 0; --eb-tt: none; --eb-ls: 0; --eb-fs: 0.82rem; }
  :root:lang(ru) { --f-display: "Noto Sans", system-ui, sans-serif; --f-body: "Noto Sans", system-ui, sans-serif; --lh-d: 1.15; --eb-tt: none; --eb-ls: 0.02em; --eb-fs: 0.8rem; }
  :root:lang(hi) { --f-display: "Noto Sans Devanagari", "Noto Sans", system-ui, sans-serif; --f-body: "Noto Sans Devanagari", "Noto Sans", system-ui, sans-serif; --lh-body: 1.85; --lh-d: 1.4; --lh-h: 1.45; --ls-d: 0; --eb-tt: none; --eb-ls: 0; --eb-fs: 0.82rem; }
  :root:lang(zh) { --f-display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; --lh-body: 1.85; --lh-d: 1.35; --lh-h: 1.4; --ls-d: 0; --eb-tt: none; --eb-ls: 0.04em; --eb-fs: 0.82rem; }
  :root:lang(ja) { --f-display: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; --f-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif; --lh-body: 1.85; --lh-d: 1.35; --lh-h: 1.4; --ls-d: 0; --eb-tt: none; --eb-ls: 0.04em; --eb-fs: 0.82rem; }
  :root:lang(ko) { --f-display: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; --lh-body: 1.8; --lh-d: 1.35; --lh-h: 1.4; --ls-d: 0; --eb-tt: none; --eb-ls: 0.02em; --eb-fs: 0.82rem; }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--f-body); font-size: 16px; line-height: var(--lh-body);
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 60; background: var(--bg);
  }
  .wrap {
    max-width: 72rem; margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  section[id] { scroll-margin-top: 5rem; }
  :root h1, :root h2, :root h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: var(--ls-d); }
  :root h1 { line-height: var(--lh-d); }
  :root h2, :root h3 { line-height: var(--lh-h); }
  .eyebrow { font-size: var(--eb-fs); font-weight: 600; letter-spacing: var(--eb-ls); text-transform: var(--eb-tt); color: var(--blue); }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 6px; }
  .btn-gold { background: var(--gold); color: var(--gold-ink); }
  .btn-gold:hover { filter: brightness(1.06); }
  .mark { background-image: linear-gradient(var(--gold), var(--gold)); background-repeat: no-repeat; background-size: 100% 0.28em; background-position: 0 92%; }
  .ruler-fill { transition: width .45s cubic-bezier(.2,.8,.2,1); }
  .ruler-pin { transition: left .45s cubic-bezier(.2,.8,.2,1); }
  .slider { scroll-snap-type: x mandatory; scrollbar-width: none; }
  .slider::-webkit-scrollbar { display: none; }
  .slide { scroll-snap-align: start; }
  .chip { background: var(--surface); color: var(--ink); cursor: pointer; transition: background .15s, border-color .15s; }
  .chip:hover { border-color: var(--blue); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ctl { background: var(--surface); color: var(--ink); }
  .ctl:hover { border-color: var(--blue); color: var(--blue); }
  .field { background: var(--bg); color: var(--ink); font: inherit; }
  .field:focus-visible { border-color: var(--blue); }
  .drop { background: var(--bg); transition: border-color .15s; }
  .drop:hover, .drop:focus-within { border-color: var(--blue); }
  .drop .choose { background: var(--ink); color: var(--bg); }
  .err { background: var(--tint); color: var(--ink); border: 1px solid var(--gold); }
  .lang-item { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 0.75rem; text-align: start; border-radius: 0.5rem; padding: 0.55rem 0.75rem; font-size: 0.95rem; line-height: 1.4; }
  .lang-item:hover { background: var(--tint); }
  .lang-item[aria-current="true"] { background: var(--tint); font-weight: 600; color: var(--blue); }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .ruler-fill, .ruler-pin { transition: none; }
  }
</style>
</head>
